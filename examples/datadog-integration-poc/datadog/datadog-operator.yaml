apiVersion: v1
kind: Namespace
metadata:
  name: datadog
---
apiVersion: v1
kind: Secret
metadata:
  name: datadog-secret
  namespace: datadog
type: Opaque
stringData:
  api-key: "<YOUR_DATADOG_API_KEY>"
  app-key: "<YOUR_DATADOG_APP_KEY>"
---
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    site: datadoghq.com
    clusterName: openshift-cluster
  features:
    # Enable Prometheus metrics collection
    prometheusScrape:
      enabled: true
      serviceEndpoints: true
    # Enable APM
    apm:
      enabled: true
    # Enable logs collection
    logCollection:
      enabled: true
      containerCollectAll: true
    # Enable cluster monitoring
    clusterChecks:
      enabled: true
    # Enable Kubernetes State Metrics
    kubeStateMetricsCore:
      enabled: true
  override:
    nodeAgent:
      tolerations:
      - operator: Exists
      env:
      - name: DD_PROMETHEUS_SCRAPE_ENABLED
        value: "true"
      - name: DD_PROMETHEUS_SCRAPE_SERVICE_ENDPOINTS
        value: "true"
      - name: DD_LOGS_ENABLED
        value: "true"
      - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
        value: "true"

