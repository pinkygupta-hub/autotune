apiVersion: v1
kind: Service
metadata:
  name: memory-monitor-service
  namespace: datadog-poc
  labels:
    app: memory-monitor
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: memory-monitor

